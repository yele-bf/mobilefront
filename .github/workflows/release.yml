name: release-apk

# Etape 12 du plan v1.5 : APK signe publie automatiquement.
# Declenche par la creation d'un tag v*. La cle de signature vit UNIQUEMENT
# dans les secrets GitHub du depot :
#   YELE_KEYSTORE_B64      : keystore PKCS12 encode base64
#   YELE_KEYSTORE_PASSWORD : mot de passe du store et de la cle (identiques)
# Elle n'apparait jamais en clair dans les logs ni dans le depot. L'empreinte
# publique du certificat (credentials/keystore-fingerprint.txt cote machine)
# est verifiee sur l'APK signe : le build echoue si un autre certificat signe.

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17 (requis par Gradle et apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Decoder la cle de signature (chiffree en secrets)
        run: |
          echo -n "${{ secrets.YELE_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/yele-release.jks"
          ls -l "$RUNNER_TEMP/yele-release.jks"
          echo "YELE_KEYSTORE_PATH=$RUNNER_TEMP/yele-release.jks" >> "$GITHUB_ENV"
          echo "YELE_KEY_ALIAS=yele-release" >> "$GITHUB_ENV"
          echo "YELE_KEYSTORE_PASSWORD=${{ secrets.YELE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Construire l'APK release (signe avec la cle de prod)
        run: flutter build apk --release

      - name: Deplacer l'APK sous un nom final
        run: |
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-release.apk" "dist/yele-${GITHUB_REF_NAME#v}.apk"

      - name: Verifier la signature (apksigner + empreinte attendue)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk | tee certs.txt
          if ! grep -qi "420507debf993c7d38bebe827bb580e3416504de8dfb330b0b71c2dd01a45f95" certs.txt; then
            echo "ECHEC : l'APK n'est pas signe avec le certificat de production attendu."
            exit 1
          fi

      - name: Publier sur la release du tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Artifact ( memes fichiers, durable 90 jours )
        uses: actions/upload-artifact@v4
        with:
          name: yele-apk-${{ github.ref_name }}
          path: dist/*.apk
