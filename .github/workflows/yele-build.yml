name: yele-build

# Contrôle de compilation : voir docs/CONTRIBUTING-equipe.md §1.3 (CI obligatoire).
# Ne tourne que sur les pull requests, comme le garde-fou.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (stricte, aucun avertissement toléré)
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test
