name: yele
description: "Yélé — Mesure de la qualité des réseaux mobiles (nouvelle app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & API
  dio: ^5.3.0

  # Navigateur intégré : test de navigation web ET lecteur YouTube du test
  # de streaming. Les implémentations de plateforme sont des dépendances
  # directes car on les configure explicitement (autoplay Android sans geste
  # utilisateur, lecture inline iOS) — sans quoi aucune vidéo ne démarrerait.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0

  # Device Info & Système
  device_info_plus: ^13.1.0

  # Type de connexion (WiFi / données mobiles)
  connectivity_plus: ^6.0.0

  # Localisation GPS
  geolocator: ^13.0.0

  # Base de données locale
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Cartes (couverture réseau)
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Utilitaires
  intl: ^0.20.2
  logger: ^2.0.0
  uuid: ^4.0.0

  # Interop DOM pour les tests streaming/navigation sur le web (Chrome)
  web: ^1.1.1

  # Export d'une mesure (IMP-13) : CSV, Excel, PDF et partage natif
  share_plus: ^13.3.0
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4

# Icône de lanceur Android : logo Yélé, régénéré par :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/logo/yele_logo_icon.png
  android: launcher_icon
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/logo/yele_logo_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/logo/yele_logo.png

  # Police embarquée pour les exports PDF/PNG : la police par défaut du
  # package pdf (Helvetica, non embarquée) ne couvre pas tous les caractères
  # latins étendus (œ, «», '…) et l'afficheur Android la substitue mal,
  # ce qui produisait des caractères cassés dans les exports.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
